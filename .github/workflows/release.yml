name: Auto Verify and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.release_url.outputs.url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Release Name
        id: get_tag
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release_name="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed -E 's/^release:[[:space:]]*//; s/[[:space:]]+$//')"
          if [[ ! "$release_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Commit subject must be 'release: <name>' (letters, numbers, dots, underscores, and hyphens only)." >&2
            exit 1
          fi
          echo "tag=$release_name" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: my-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: my-app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: my-app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          RELEASE_NAME: ${{ steps.get_tag.outputs.tag }}
        run: pnpm exec vite build --base "/${REPOSITORY_NAME}/${RELEASE_NAME}/"

      - name: Check out existing published releases
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Add release build to Pages artifact
        env:
          RELEASE_NAME: ${{ steps.get_tag.outputs.tag }}
        run: |
          rm -rf published/.git
          mkdir -p "published/$RELEASE_NAME"
          cp -R my-app/dist/. "published/$RELEASE_NAME/"

      - name: Save published releases
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: published

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Set release URL
        id: release_url
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_NAME: ${{ steps.get_tag.outputs.tag }}
        run: echo "url=${PAGE_URL%/}/$RELEASE_NAME/" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          body: |
            Automated submission for ${{ steps.get_tag.outputs.tag }}.
            Please find the completion status in the attached status.md file.

            Deployed site: ${{ steps.release_url.outputs.url }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
