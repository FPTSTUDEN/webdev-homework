name: Deploy assignment

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    if: startsWith(github.event.head_commit.message, 'assignment:')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract assignment folder
        id: assignment
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          assignment="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed -E 's/^assignment:[[:space:]]*//')"
          if [[ ! "$assignment" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Commit subject must be 'assignment: <lowercase-name>' (letters, numbers, and hyphens only)." >&2
            exit 1
          fi
          echo "name=$assignment" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: my-app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: my-app
        run: pnpm install --frozen-lockfile

      - name: Build app
        working-directory: my-app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          ASSIGNMENT: ${{ steps.assignment.outputs.name }}
        run: pnpm exec vite build --base "/${REPOSITORY_NAME}/${ASSIGNMENT}/"

      - name: Check out existing published assignments
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published

      - name: Add assignment build to Pages artifact
        env:
          ASSIGNMENT: ${{ steps.assignment.outputs.name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          rm -rf published/.git
          mkdir -p "published/$ASSIGNMENT"
          cp -R my-app/dist/. "published/$ASSIGNMENT/"
          printf '<!doctype html>\n<html lang="en">\n<head><meta charset="utf-8"><title>Published assignments</title></head>\n<body><h1>Published assignments</h1><p><a href="/%s/%s/">%s</a></p></body>\n</html>\n' \
            "$REPOSITORY_NAME" "$ASSIGNMENT" "$ASSIGNMENT" > published/index.html

      - name: Save published assignments
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: published

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
